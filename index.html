<style>
:root{
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --bg:#f5f7fb; --bg-2:#eaeff8; --surface:#ffffff; --surface-2:#f0f3fa;
  --text:#0d1630; --muted:#55627f; --line:rgba(13,22,48,.11);
  --primary:#2563eb; --primary-2:#0891b2; --ring:rgba(37,99,235,.40);
  --glow-1:rgba(37,99,235,.20); --glow-2:rgba(8,145,178,.18); --bar:rgba(245,247,251,.82);
  --shadow:0 1px 2px rgba(13,22,48,.06), 0 14px 34px -16px rgba(13,22,48,.22);
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a1020; --bg-2:#0d1530; --surface:#111a31; --surface-2:#17223f;
    --text:#e9eefc; --muted:#9dadcd; --line:rgba(255,255,255,.10);
    --primary:#6aa3ff; --primary-2:#22d3ee; --ring:rgba(106,163,255,.50);
    --glow-1:rgba(59,130,246,.28); --glow-2:rgba(34,211,238,.16); --bar:rgba(10,16,32,.78);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 22px 44px -22px rgba(0,0,0,.7);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
svg{display:block}
p{margin:0 0 1em}
.wrap{width:min(1120px, 100% - 40px);margin-inline:auto}
.skip{position:absolute;left:-999px;top:8px;z-index:100;padding:10px 14px;border-radius:10px;background:var(--text);color:var(--bg);font-weight:600}
.skip:focus{left:12px}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:8px}

/* ---------- üst panel ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.015em;text-decoration:none;font-size:1.05rem}
.brand svg{width:34px;height:34px;border-radius:10px}
.nav ul{display:flex;align-items:center;gap:4px;margin:0;padding:0;list-style:none}
.nav .link{display:inline-block;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:550;font-size:.95rem}
.nav .link:hover{color:var(--text);background:var(--surface-2)}
@media (max-width:640px){.nav .hide-sm{display:none}}

/* ---------- düymələr ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid transparent;font:inherit;font-weight:650;text-decoration:none;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{color:#fff;background:linear-gradient(135deg,#2f6df0,#1f56d6);box-shadow:0 12px 26px -12px #2f6df0}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 16px 30px -12px #2f6df0}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.soft{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:default}
.btn.sm{min-height:40px;padding:0 16px;font-size:.92rem;border-radius:12px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-30% -10% 0 -10%;z-index:-1;
  background:
    radial-gradient(55% 50% at 12% 8%, var(--glow-1), transparent 70%),
    radial-gradient(45% 45% at 92% 18%, var(--glow-2), transparent 70%)}
.hero-inner{display:grid;gap:40px;align-items:center;padding:46px 0 96px}
@media (min-width:900px){.hero-inner{grid-template-columns:1.2fr .8fr;padding:84px 0 124px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 4px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:600}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
h1{margin:18px 0 16px;font-size:clamp(2.15rem,6.6vw,3.8rem);line-height:1.05;letter-spacing:-.035em;font-weight:800}
.grad{background:linear-gradient(100deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:56ch;color:var(--muted);font-size:clamp(1.05rem,2.5vw,1.22rem)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 0;padding:0;list-style:none}
.stats li{min-width:118px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.stats b{display:block;font-size:1.35rem;line-height:1.2;letter-spacing:-.02em}
.stats span{color:var(--muted);font-size:.84rem}
.cluster{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:min(340px,100%);margin-inline:auto;transform:rotate(-4deg)}
.cluster a{display:block;aspect-ratio:1;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .2s ease}
.cluster a:nth-child(2){transform:translateY(20px)}
.cluster a:nth-child(3){transform:translateY(-6px)}
.cluster a:nth-child(4){transform:translateY(14px)}
.cluster a:hover{transform:translateY(-4px) scale(1.03)}
.cluster svg{width:100%;height:100%}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:64px}
.wave path{fill:var(--bg)}

/* ---------- bölmələr ---------- */
.section{padding:64px 0}
.section.alt{background:var(--bg-2)}
.section-head{max-width:62ch;margin-bottom:30px}
h2{margin:0 0 10px;font-size:clamp(1.65rem,4.4vw,2.4rem);line-height:1.12;letter-spacing:-.028em;font-weight:800}
.section-head p{margin:0;color:var(--muted)}

/* ---------- tətbiq kartları ---------- */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);scroll-margin-top:86px}
.card-top{display:flex;align-items:center;gap:14px}
.icon{flex:none;width:68px;height:68px;border-radius:17px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.icon svg{width:100%;height:100%}
.tag{margin:0;font-size:.74rem;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--primary)}
h3{margin:2px 0 0;font-size:1.2rem;line-height:1.25;letter-spacing:-.012em}
.summary{margin:0;color:var(--muted)}
.feat{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.feat li{position:relative;padding-left:26px}
.feat li::before{content:"";position:absolute;left:5px;top:.42em;width:6px;height:11px;border:solid var(--primary);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.78rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:6px}
.card.soon{border-style:dashed;box-shadow:none;background:transparent}
.badge{position:absolute;top:16px;right:16px;padding:3px 10px;border-radius:999px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#04112b;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}

/* ---------- haqqında ---------- */
.about{display:grid;gap:34px}
@media (min-width:900px){.about{grid-template-columns:1fr 1.2fr;align-items:start}}
.values{display:grid;gap:14px;margin:0;padding:0;list-style:none}
@media (min-width:560px){.values{grid-template-columns:1fr 1fr}}
.values li{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.values h3{margin:0 0 6px;font-size:1.02rem}
.values p{margin:0;color:var(--muted);font-size:.95rem}
.about > div > p{color:var(--muted)}

/* ---------- FAQ ---------- */
.faq{max-width:820px}
.faq details{padding:0 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.faq details + details{margin-top:10px}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;font-weight:650;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font-size:1.5rem;line-height:1;color:var(--primary);transition:transform .2s ease}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 16px;color:var(--muted)}
.faq a{color:var(--primary);font-weight:600}

/* ---------- əlaqə ---------- */
.contact{padding:clamp(24px,5vw,44px);border:1px solid var(--line);border-radius:28px;background:
  radial-gradient(60% 90% at 100% 0%, var(--glow-2), transparent 70%),
  radial-gradient(60% 90% at 0% 100%, var(--glow-1), transparent 70%), var(--surface);box-shadow:var(--shadow)}
.contact p{max-width:58ch;color:var(--muted)}

/* ---------- footer ---------- */
footer{padding:38px 0 46px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}
.foot{display:grid;gap:22px}
@media (min-width:760px){.foot{grid-template-columns:1.2fr 1fr 1fr}}
.foot h4{margin:0 0 8px;color:var(--text);font-size:.9rem}
.foot ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.foot a{text-decoration:none}
.foot a:hover{color:var(--text);text-decoration:underline}
.legal{margin:26px 0 0;font-size:.8rem;opacity:.85}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>
